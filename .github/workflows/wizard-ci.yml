name: Wizard CI

permissions:
  contents: read

on:
  # Scheduled runs (Wed at 11 AM EST / 4 PM UTC)
  schedule:
    - cron: '0 16 * * 3'

  # Manual and programmatic triggers
  workflow_dispatch:
    inputs:
      app:
        description: 'App path (e.g. "basic-integration/next-js/15-app-router-saas"), framework (e.g. "basic-integration/next-js"), category (e.g. "basic-integration"), "sample", or "all".'
        required: false
        type: string
        default: ''
      evaluate:
        description: 'Run PR evaluator'
        type: boolean
        default: true
      base_branch:
        description: 'Base branch for PR'
        type: string
        default: 'main'
      wizard_ref:
        description: 'Wizard repo branch/tag/sha'
        type: string
        default: 'main'
      context_mill_ref:
        description: 'Context Mill repo branch/tag/sha'
        type: string
        default: 'main'
      posthog_ref:
        description: 'PostHog repo branch/tag/sha (for MCP)'
        type: string
        default: 'master'
      posthog_region:
        description: 'PostHog region (us or eu)'
        required: false
        type: choice
        options:
          - us
          - eu
        default: 'us'
      trigger_id:
        description: 'Trigger ID (auto-generated if empty)'
        type: string
        default: ''
      notify_slack:
        description: 'Post notifications to Slack'
        type: boolean
        default: false
      snapshots:
        description: 'Run real-TUI snapshots instead of the evaluator (opens a review PR)'
        type: boolean
        default: false

  # Webhook trigger from external repos (wizard, context-mill, posthog)
  # POST https://api.github.com/repos/{owner}/{repo}/dispatches
  # Body: {"event_type": "wizard-ci-trigger", "client_payload": {"app": "all", "source": "wizard"}}
  repository_dispatch:
    types: [wizard-ci-trigger]

jobs:
  # ============================================================================
  # DISCOVER: Find and select apps to run
  # ============================================================================
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.select-apps.outputs.apps }}
      app_count: ${{ steps.select-apps.outputs.app_count }}
      first_app: ${{ steps.select-apps.outputs.first_app }}
      trigger_id: ${{ steps.generate-id.outputs.trigger_id }}
      # Resolved inputs (from workflow_dispatch, repository_dispatch, or schedule)
      input_app: ${{ steps.resolve-inputs.outputs.app }}
      input_evaluate: ${{ steps.resolve-inputs.outputs.evaluate }}
      input_base_branch: ${{ steps.resolve-inputs.outputs.base_branch }}
      input_wizard_ref: ${{ steps.resolve-inputs.outputs.wizard_ref }}
      input_context_mill_ref: ${{ steps.resolve-inputs.outputs.context_mill_ref }}
      input_posthog_ref: ${{ steps.resolve-inputs.outputs.posthog_ref }}
      input_posthog_region: ${{ steps.resolve-inputs.outputs.posthog_region }}
      input_source: ${{ steps.resolve-inputs.outputs.source }}
      input_notify_slack: ${{ steps.resolve-inputs.outputs.notify_slack }}
      # PR notification outputs (for upstream PR triggers)
      input_notify_pr: ${{ steps.resolve-inputs.outputs.notify_pr }}
      input_source_repo: ${{ steps.resolve-inputs.outputs.source_repo }}
      input_source_pr_number: ${{ steps.resolve-inputs.outputs.source_pr_number }}
      input_source_pr_url: ${{ steps.resolve-inputs.outputs.source_pr_url }}

    steps:
      - name: Resolve inputs
        id: resolve-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CP_APP: ${{ github.event.client_payload.app }}
          CP_EVALUATE: ${{ github.event.client_payload.evaluate }}
          CP_BASE_BRANCH: ${{ github.event.client_payload.base_branch }}
          CP_WIZARD_REF: ${{ github.event.client_payload.wizard_ref }}
          CP_CONTEXT_MILL_REF: ${{ github.event.client_payload.context_mill_ref }}
          CP_POSTHOG_REF: ${{ github.event.client_payload.posthog_ref }}
          CP_POSTHOG_REGION: ${{ github.event.client_payload.posthog_region }}
          CP_TRIGGER_ID: ${{ github.event.client_payload.trigger_id }}
          CP_SOURCE: ${{ github.event.client_payload.source }}
          CP_NOTIFY_SLACK: ${{ github.event.client_payload.notify_slack }}
          CP_NOTIFY_PR: ${{ github.event.client_payload.notify_pr }}
          CP_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          CP_SOURCE_PR_NUMBER: ${{ github.event.client_payload.source_pr_number }}
          CP_SOURCE_PR_URL: ${{ github.event.client_payload.source_pr_url }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_EVALUATE: ${{ inputs.evaluate }}
          INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
          INPUT_WIZARD_REF: ${{ inputs.wizard_ref }}
          INPUT_CONTEXT_MILL_REF: ${{ inputs.context_mill_ref }}
          INPUT_POSTHOG_REF: ${{ inputs.posthog_ref }}
          INPUT_POSTHOG_REGION: ${{ inputs.posthog_region }}
          INPUT_TRIGGER_ID: ${{ inputs.trigger_id }}
          INPUT_NOTIFY_SLACK: ${{ inputs.notify_slack }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            APP="all"
            EVALUATE="true"
            BASE_BRANCH="main"
            WIZARD_REF="main"
            CONTEXT_MILL_REF="main"
            POSTHOG_REF="master"
            POSTHOG_REGION="us"
            TRIGGER_ID=""
            SOURCE="scheduled"
            NOTIFY_SLACK="true"
            NOTIFY_PR="false"
            SOURCE_REPO=""
            SOURCE_PR_NUMBER=""
            SOURCE_PR_URL=""
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            APP="${CP_APP:-all}"
            EVALUATE="${CP_EVALUATE:-true}"
            BASE_BRANCH="${CP_BASE_BRANCH:-main}"
            WIZARD_REF="${CP_WIZARD_REF:-main}"
            CONTEXT_MILL_REF="${CP_CONTEXT_MILL_REF:-main}"
            POSTHOG_REF="${CP_POSTHOG_REF:-master}"
            POSTHOG_REGION="${CP_POSTHOG_REGION:-us}"
            TRIGGER_ID="${CP_TRIGGER_ID:-}"
            RAW_SOURCE="${CP_SOURCE:-dispatch}"
            case "$RAW_SOURCE" in
              wizard) SOURCE="wizard repo" ;;
              context-mill) SOURCE="context-mill repo" ;;
              *) SOURCE="$RAW_SOURCE" ;;
            esac
            NOTIFY_SLACK="${CP_NOTIFY_SLACK:-false}"
            NOTIFY_PR="${CP_NOTIFY_PR:-false}"
            SOURCE_REPO="${CP_SOURCE_REPO:-}"
            SOURCE_PR_NUMBER="${CP_SOURCE_PR_NUMBER:-}"
            SOURCE_PR_URL="${CP_SOURCE_PR_URL:-}"
          else
            APP="${INPUT_APP:-all}"
            EVALUATE="${INPUT_EVALUATE:-true}"
            BASE_BRANCH="${INPUT_BASE_BRANCH:-main}"
            WIZARD_REF="${INPUT_WIZARD_REF:-main}"
            CONTEXT_MILL_REF="${INPUT_CONTEXT_MILL_REF:-main}"
            POSTHOG_REF="${INPUT_POSTHOG_REF:-master}"
            POSTHOG_REGION="${INPUT_POSTHOG_REGION:-us}"
            TRIGGER_ID="${INPUT_TRIGGER_ID:-}"
            SOURCE="manual"
            NOTIFY_SLACK="${INPUT_NOTIFY_SLACK:-false}"
            NOTIFY_PR="false"
            SOURCE_REPO=""
            SOURCE_PR_NUMBER=""
            SOURCE_PR_URL=""
          fi

          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "evaluate=$EVALUATE" >> $GITHUB_OUTPUT
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT
          echo "wizard_ref=$WIZARD_REF" >> $GITHUB_OUTPUT
          echo "context_mill_ref=$CONTEXT_MILL_REF" >> $GITHUB_OUTPUT
          echo "posthog_ref=$POSTHOG_REF" >> $GITHUB_OUTPUT
          echo "posthog_region=$POSTHOG_REGION" >> $GITHUB_OUTPUT
          echo "trigger_id=$TRIGGER_ID" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "notify_slack=$NOTIFY_SLACK" >> $GITHUB_OUTPUT
          echo "notify_pr=$NOTIFY_PR" >> $GITHUB_OUTPUT
          echo "source_repo=$SOURCE_REPO" >> $GITHUB_OUTPUT
          echo "source_pr_number=$SOURCE_PR_NUMBER" >> $GITHUB_OUTPUT
          echo "source_pr_url=$SOURCE_PR_URL" >> $GITHUB_OUTPUT

          echo "Resolved inputs:"
          echo "  app: $APP"
          echo "  evaluate: $EVALUATE"
          echo "  base_branch: $BASE_BRANCH"
          echo "  wizard_ref: $WIZARD_REF"
          echo "  context_mill_ref: $CONTEXT_MILL_REF"
          echo "  posthog_ref: $POSTHOG_REF"
          echo "  posthog_region: $POSTHOG_REGION"
          echo "  source: $SOURCE"
          echo "  notify_slack: $NOTIFY_SLACK"
          echo "  notify_pr: $NOTIFY_PR"
          echo "  source_repo: $SOURCE_REPO"
          echo "  source_pr_number: $SOURCE_PR_NUMBER"
          echo "  source_pr_url: $SOURCE_PR_URL"

      - name: Generate trigger ID
        id: generate-id
        env:
          RESOLVED_TRIGGER_ID: ${{ steps.resolve-inputs.outputs.trigger_id }}
        run: |
          TRIGGER_ID="$RESOLVED_TRIGGER_ID"
          if [ -n "$TRIGGER_ID" ]; then
            echo "Using provided trigger ID: $TRIGGER_ID"
          else
            TRIGGER_ID=$(openssl rand -hex 4 | cut -c1-7)
            echo "Generated trigger ID: $TRIGGER_ID"
          fi
          echo "trigger_id=$TRIGGER_ID" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Find available apps
        id: find-apps
        run: |
          # Apps live under apps/{workflow}/{framework}/{app}, where {workflow}
          # is the `dir` of a manifest entry with `ciCapable: true`.
          # .wizard-root marks monorepo roots that should not be recursed into.
          WORKFLOW_DIRS=$(jq -r '.workflows[] | select(.ciCapable == true) | .dir' apps/manifest.json)
          APPS=""
          for wf in $WORKFLOW_DIRS; do
            [ -d "apps/$wf" ] || continue
            while IFS= read -r dir; do
              if [ -f "$dir/.wizard-root" ]; then
                APPS="$APPS
          $(echo "$dir" | sed 's|apps/||')"
              else
                for app in "$dir"/*/; do
                  [ -d "$app" ] && APPS="$APPS
          $(echo "${app%/}" | sed 's|apps/||')"
                done
              fi
            done < <(find "apps/$wf" -mindepth 1 -maxdepth 1 -type d | sort)
          done

          APPS=$(echo "$APPS" | sed '/^$/d' | sort)

          # Convert to JSON array
          APPS_JSON=$(echo "$APPS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=$APPS_JSON" >> $GITHUB_OUTPUT

          echo "Available apps:"
          echo "$APPS"

      - name: Select apps to run
        id: select-apps
        env:
          INPUT_APP: ${{ steps.resolve-inputs.outputs.app }}
          AVAILABLE: ${{ steps.find-apps.outputs.apps }}
        run: |
          if [ -z "$INPUT_APP" ] || [ "$INPUT_APP" = "all" ]; then
            SELECTED="$AVAILABLE"
            echo "Running all apps"
          elif [ "$INPUT_APP" = "sample" ]; then
            # One app per framework (second path segment)
            SELECTED=$(echo "$AVAILABLE" | jq -c '
              group_by(split("/")[1]) | map(.[0])
            ')
            echo "Running sample (one per framework)"
          else
            # Check if it's an exact app match
            if echo "$AVAILABLE" | jq -e --arg app "$INPUT_APP" 'index($app) != null' > /dev/null; then
              SELECTED="[\"$INPUT_APP\"]"
              echo "Running single app: $INPUT_APP"
            else
              # Check if it's a prefix match (workflow or framework)
              MATCHED=$(echo "$AVAILABLE" | jq -c --arg prefix "$INPUT_APP/" '[.[] | select(startswith($prefix))]')
              MATCH_COUNT=$(echo "$MATCHED" | jq 'length')

              if [ "$MATCH_COUNT" -gt 0 ]; then
                SELECTED="$MATCHED"
                echo "Running $MATCH_COUNT app(s) matching prefix: $INPUT_APP"
              else
                echo "::error::App or category '$INPUT_APP' not found."
                echo "Available apps:"
                echo "$AVAILABLE" | jq -r '.[]'
                exit 1
              fi
            fi
          fi

          echo "apps=$SELECTED" >> $GITHUB_OUTPUT
          APP_COUNT=$(echo "$SELECTED" | jq 'length')
          echo "app_count=$APP_COUNT" >> $GITHUB_OUTPUT
          FIRST_APP=$(echo "$SELECTED" | jq -r '.[0]')
          echo "first_app=$FIRST_APP" >> $GITHUB_OUTPUT
          echo "Selected $APP_COUNT app(s) to run"

  # ============================================================================
  # NOTIFY-START: Post initial Slack notification (if enabled)
  # ============================================================================
  notify-start:
    needs: discover
    runs-on: ubuntu-latest
    if: needs.discover.outputs.input_notify_slack == 'true'
    outputs:
      thread_ts: ${{ steps.slack.outputs.thread_ts }}
    steps:
      - name: Post to Slack
        id: slack
        run: |
          RESPONSE=$(curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "Wizard CI Started - Trigger ID: ${{ needs.discover.outputs.trigger_id }}",
              "blocks": [
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Trigger ID:* `${{ needs.discover.outputs.trigger_id }}`"},
                    {"type": "mrkdwn", "text": "*Apps:* ${{ needs.discover.outputs.app_count }}"},
                    {"type": "mrkdwn", "text": "*Source:* ${{ needs.discover.outputs.input_source }}"},
                    {"type": "mrkdwn", "text": "*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"}
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {"type": "mrkdwn", "text": "_AlaakuhhZAAM!_ :magic_wand: Creating wizard runs..."}
                  ]
                }
              ]
            }')

          echo "Slack API response: $RESPONSE"
          THREAD_TS=$(echo "$RESPONSE" | jq -r '.ts')
          if [ "$THREAD_TS" = "null" ] || [ -z "$THREAD_TS" ]; then
            echo "::warning::Failed to get Slack thread_ts. Response: $RESPONSE"
            echo "thread_ts=" >> $GITHUB_OUTPUT
          else
            echo "thread_ts=$THREAD_TS" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # NOTIFY-PR-START: Create initial PR comment with pending status (if enabled)
  # ============================================================================
  notify-pr-start:
    needs: discover
    runs-on: ubuntu-latest
    if: needs.discover.outputs.input_notify_pr == 'true' && needs.discover.outputs.input_source_pr_number != ''
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_PRIVATE_KEY }}
          owner: PostHog
          repositories: ${{ needs.discover.outputs.input_source_repo }}

      - name: Create initial PR comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = 'PostHog';
            const repo = '${{ needs.discover.outputs.input_source_repo }}';
            const issueNumber = ${{ needs.discover.outputs.input_source_pr_number }};
            const triggerId = '${{ needs.discover.outputs.trigger_id }}';
            const allApps = ${{ needs.discover.outputs.apps }};
            const workflowUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const wizardRef = '${{ needs.discover.outputs.input_wizard_ref }}';
            const contextMillRef = '${{ needs.discover.outputs.input_context_mill_ref }}';
            const posthogRef = '${{ needs.discover.outputs.input_posthog_ref }}';
            const prsUrl = workflowUrl.replace('/actions/runs/', '/pulls?q=') + triggerId;

            const marker = '<!-- wizard-ci-results:' + triggerId + ' -->';

            const rows = allApps.map(function(a) {
              return '| `' + a + '` | ⏳ | pending | |';
            }).join('\n');

            const body = [
              marker,
              '## 🧙 Wizard CI Results',
              '',
              '**Trigger ID:** `' + triggerId + '`',
              '**Workflow:** [View run](' + workflowUrl + ')',
              '',
              '| App | Confidence | PR | YARA |',
              '|-----|------------|-----|------|',
              rows,
              '',
              '### Configuration',
              '',
              '| Setting | Value |',
              '|---------|-------|',
              '| Wizard ref | `' + wizardRef + '` |',
              '| Context Mill ref | `' + contextMillRef + '` |',
              '| PostHog ref | `' + posthogRef + '` |',
              '',
              '> Search for trigger ID `' + triggerId + '` in [wizard-workbench PRs](' + prsUrl + ').'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: issueNumber,
              body: body
            });

            console.log('Created initial PR comment with trigger ID: ' + triggerId);

  # ============================================================================
  # SETUP-DEPS: Build wizard, context-mill, and MCP once and warm the cache
  # before the matrix fans out, so the parallel app jobs restore instead of
  # each rebuilding the same artifacts.
  # ============================================================================
  setup-deps:
    needs: discover
    if: needs.discover.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_PRIVATE_KEY }}
          owner: PostHog
          repositories: |
            wizard-workbench
            warlock

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061

      - name: Build and cache dependencies
        uses: ./.github/actions/setup-wizard-deps
        with:
          wizard_ref: ${{ needs.discover.outputs.input_wizard_ref }}
          context_mill_ref: ${{ needs.discover.outputs.input_context_mill_ref }}
          posthog_ref: ${{ needs.discover.outputs.input_posthog_ref }}
          app_token: ${{ steps.app-token.outputs.token }}
          save_cache: 'true'

  # ============================================================================
  # WIZARD-CI: Run wizard on each app (matrix strategy)
  # ============================================================================
  wizard-ci:
    needs: [discover, notify-start, notify-pr-start, setup-deps]
    if: always() && needs.discover.result == 'success'
    runs-on: ${{ contains(matrix.app, 'swift/') && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    outputs:
      pr_url: ${{ steps.process-results.outputs.pr_url }}
      pr_number: ${{ steps.process-results.outputs.pr_number }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_PRIVATE_KEY }}
          owner: PostHog
          repositories: |
            wizard-workbench
            warlock

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GitHub CLI
        run: |
          if command -v gh > /dev/null 2>&1; then
            echo "gh already installed: $(gh --version | head -1)"
            exit 0
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            brew update
            brew install gh
          elif [ "$RUNNER_OS" = "Linux" ]; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          else
            echo "Unsupported runner OS: $RUNNER_OS"
            exit 1
          fi

      - name: Setup wizard dependencies
        # Restores wizard / context-mill / MCP from the cache warmed by the
        # setup-deps job (keyed on each repo's resolved commit SHA), falling
        # back to a clean build on a miss (e.g. macOS runners, cache eviction).
        # Exports WIZARD_PATH / CONTEXT_MILL_PATH / MCP_PATH.
        uses: ./.github/actions/setup-wizard-deps
        with:
          wizard_ref: ${{ needs.discover.outputs.input_wizard_ref }}
          context_mill_ref: ${{ needs.discover.outputs.input_context_mill_ref }}
          posthog_ref: ${{ needs.discover.outputs.input_posthog_ref }}
          app_token: ${{ steps.app-token.outputs.token }}
          save_cache: 'false'

      - name: Configure Git
        run: |
          git config user.name "wizard-ci[bot]"
          git config user.email "wizard-ci[bot]@users.noreply.github.com"
          # Switch remote to HTTPS for token-based auth
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPO}.git"
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Run Wizard CI
        id: run-wizard
        run: |
          # Start context-mill dev server in background (serves resources at localhost:8765)
          cd $CONTEXT_MILL_PATH
          npm run dev &
          CONTEXT_MILL_PID=$!
          disown $CONTEXT_MILL_PID

          # Wait for context-mill server to be ready (retry every 30s, max 2 minutes)
          echo "Waiting for context-mill server to start..."
          CONTEXT_MILL_READY=false
          for attempt in 1 2 3 4; do
            for i in {1..30}; do
              if curl -s http://localhost:8765/context-mill-mcp-resources.zip > /dev/null 2>&1; then
                echo "Context Mill server is ready"
                CONTEXT_MILL_READY=true
                break 2
              fi
              sleep 1
            done
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::Context Mill not ready after $((attempt * 30))s, retrying..."
            fi
          done
          if [ "$CONTEXT_MILL_READY" = "false" ]; then
            echo "::warning::Context Mill server failed to start after 2 minutes"
          fi

          # Start MCP server in background (consumes from local examples server)
          cd $MCP_PATH
          pnpm dev:local-resources &
          MCP_PID=$!
          disown $MCP_PID

          # Wait for MCP server to be ready (retry every 30s, max 2 minutes)
          echo "Waiting for MCP server to start..."
          MCP_READY=false
          for attempt in 1 2 3 4; do
            for i in {1..30}; do
              if curl -s http://localhost:8787/mcp > /dev/null 2>&1; then
                echo "MCP server is ready"
                MCP_READY=true
                break 2
              fi
              sleep 1
            done
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::MCP server not ready after $((attempt * 30))s, retrying..."
            fi
          done
          if [ "$MCP_READY" = "false" ]; then
            echo "::warning::MCP server failed to start after 2 minutes"
          fi

          echo "mcp_pid=$MCP_PID" >> $GITHUB_OUTPUT
          echo "context_mill_pid=$CONTEXT_MILL_PID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # PostHog credentials
          POSTHOG_REGION: ${{ needs.discover.outputs.input_posthog_region }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_POSTHOG_PERSONAL_KEY }}
          # Dependency paths
          WIZARD_PATH: ${{ env.WIZARD_PATH }}
          CONTEXT_MILL_PATH: ${{ env.CONTEXT_MILL_PATH }}
          MCP_PATH: ${{ env.MCP_PATH }}
          # Dependency refs (for PR body)
          WIZARD_REF: ${{ needs.discover.outputs.input_wizard_ref }}
          CONTEXT_MILL_REF: ${{ needs.discover.outputs.input_context_mill_ref }}
          POSTHOG_REF: ${{ needs.discover.outputs.input_posthog_ref }}
          # Source info (for PR body)
          CI_SOURCE: ${{ needs.discover.outputs.input_source }}
          # Enable YARA security scanner report
          POSTHOG_WIZARD_YARA_REPORT: 'true'
          # PostHog tracking for eval analytics
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}

      - name: Execute wizard
        id: execute-wizard
        continue-on-error: true
        run: |
          CMD_ARGS=(pnpm wizard-ci --app "$MATRIX_APP" --base "$INPUT_BASE_BRANCH")
          if [ -n "$TRIGGER_ID" ]; then
            CMD_ARGS+=(--trigger-id "$TRIGGER_ID")
          fi
          if [ "$INPUT_EVALUATE" = "true" ]; then
            CMD_ARGS+=(--evaluate)
          fi
          "${CMD_ARGS[@]}" 2>&1 | tee wizard-output.log
        env:
          MATRIX_APP: ${{ matrix.app }}
          INPUT_BASE_BRANCH: ${{ needs.discover.outputs.input_base_branch }}
          TRIGGER_ID: ${{ needs.discover.outputs.trigger_id }}
          INPUT_EVALUATE: ${{ needs.discover.outputs.input_evaluate }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          POSTHOG_REGION: ${{ needs.discover.outputs.input_posthog_region }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_POSTHOG_PERSONAL_KEY }}
          WIZARD_PATH: ${{ env.WIZARD_PATH }}
          CONTEXT_MILL_PATH: ${{ env.CONTEXT_MILL_PATH }}
          MCP_PATH: ${{ env.MCP_PATH }}
          WIZARD_REF: ${{ needs.discover.outputs.input_wizard_ref }}
          CONTEXT_MILL_REF: ${{ needs.discover.outputs.input_context_mill_ref }}
          POSTHOG_REF: ${{ needs.discover.outputs.input_posthog_ref }}
          CI_SOURCE: ${{ needs.discover.outputs.input_source }}
          POSTHOG_WIZARD_YARA_REPORT: 'true'
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}

      - name: Process results
        id: process-results
        if: always()
        run: |
          if [ "$WIZARD_OUTCOME" != "success" ]; then
            echo "::warning::Wizard exited with failure for $MATRIX_APP"
          fi

          # Save resources zips from running server (for artifact upload)
          curl -s http://localhost:8765/context-mill-mcp-resources.zip -o context-mill-mcp-resources.zip || true
          curl -s http://localhost:8765/skills-mcp-resources.zip -o skills-mcp-resources.zip || true

          # Stop servers
          kill "$MCP_PID" 2>/dev/null || true
          kill "$CONTEXT_MILL_PID" 2>/dev/null || true

          # Extract PR URL
          PR_URL=$(sed -n 's#.*PR: \(https://github.com/[^[:space:]]*\).*#\1#p' wizard-output.log | head -1 || true)
          if [ -n "$PR_URL" ]; then
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            PR_NUM=$(echo "$PR_URL" | sed -n 's#.*/pull/\([0-9][0-9]*\).*#\1#p')
            echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          fi

          # Extract confidence score from evaluator output (e.g., "### Confidence score: 4/5")
          CONFIDENCE=$(grep -o 'Confidence score: [0-9]/[0-9]' wizard-output.log | head -1 | sed 's/Confidence score: //' || echo "")
          echo "confidence_score=$CONFIDENCE" >> $GITHUB_OUTPUT
          echo "Extracted confidence score: '$CONFIDENCE'"

          # Read YARA scanner JSON report (written by wizard to /tmp)
          YARA_JSON="/tmp/posthog-wizard-yara-report.json"
          if [ -f "$YARA_JSON" ]; then
            TOTAL=$(jq -r '.summary.totalScans' "$YARA_JSON")
            VIOLATIONS=$(jq -r '.summary.violations' "$YARA_JSON")
            CLEAN=$(jq -r '.summary.clean' "$YARA_JSON")

            # Build human-readable summary
            YARA_SUMMARY="${TOTAL} tool calls scanned, ${VIOLATIONS} violation(s) detected"
            if [ "$VIOLATIONS" -gt 0 ]; then
              # Append violation details
              VIOLATION_LINES=$(jq -r '.violations[] | "[" + (.action | ascii_upcase) + "] " + .rule + " (" + .severity + ") — " + .phase + ":" + .tool' "$YARA_JSON")
              YARA_SUMMARY="${YARA_SUMMARY}
          ${VIOLATION_LINES}"
            else
              YARA_SUMMARY="${YARA_SUMMARY}
          No violations"
            fi

            echo "yara_report<<EOF" >> $GITHUB_OUTPUT
            echo "$YARA_SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "yara_total_scans=$TOTAL" >> $GITHUB_OUTPUT
            echo "yara_violation_count=$VIOLATIONS" >> $GITHUB_OUTPUT

            if [ "$VIOLATIONS" -gt 0 ]; then
              echo "yara_violations=true" >> $GITHUB_OUTPUT
              echo "YARA: $VIOLATIONS violation(s) detected (informational)"
            else
              echo "yara_violations=false" >> $GITHUB_OUTPUT
              echo "YARA: $TOTAL scans, all clean"
            fi
          else
            echo "yara_violations=false" >> $GITHUB_OUTPUT
            echo "yara_violation_count=0" >> $GITHUB_OUTPUT
            echo "No YARA report file found"
          fi
        env:
          WIZARD_OUTCOME: ${{ steps.execute-wizard.outcome }}
          MATRIX_APP: ${{ matrix.app }}
          MCP_PID: ${{ steps.run-wizard.outputs.mcp_pid }}
          CONTEXT_MILL_PID: ${{ steps.run-wizard.outputs.context_mill_pid }}

      - name: Configure AWS credentials
        if: always() && !env.ACT
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_WIZARD_ARTIFACTS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_WIZARD_ARTIFACTS_REGION }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Upload artifacts to S3
        if: always() && !env.ACT
        continue-on-error: true
        run: |
          SAFE_APP="$MATRIX_APP"
          SAFE_APP="${SAFE_APP//\//-}"
          S3_PREFIX="s3://${AWS_BUCKET}/${TRIGGER_ID}/${SAFE_APP}"

          aws s3 cp context-mill-mcp-resources.zip "${S3_PREFIX}/context-mill-mcp-resources.zip" || true
          aws s3 cp skills-mcp-resources.zip "${S3_PREFIX}/skills-mcp-resources.zip" || true

          WIZARD_LOG="/tmp/posthog-wizard.log"
          if [ -f "$WIZARD_LOG" ]; then
            aws s3 cp "$WIZARD_LOG" "${S3_PREFIX}/posthog-wizard.log" || true
          fi

          YARA_JSON="/tmp/posthog-wizard-yara-report.json"
          if [ -f "$YARA_JSON" ]; then
            aws s3 cp "$YARA_JSON" "${S3_PREFIX}/posthog-wizard-yara-report.json" || true
          fi
        env:
          MATRIX_APP: ${{ matrix.app }}
          TRIGGER_ID: ${{ needs.discover.outputs.trigger_id }}
          AWS_BUCKET: ${{ secrets.AWS_WIZARD_ARTIFACTS_BUCKET }}

      - name: Label and close PR
        if: steps.process-results.outputs.pr_number
        run: |
          gh pr edit "$PR_NUMBER" --add-label "CI/CD"
          gh pr close "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.process-results.outputs.pr_number }}

      - name: Summary
        if: always()
        run: |
          echo "## Wizard CI Results: $APP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger ID:** \`$TRIGGER_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "**App:** $APP" >> $GITHUB_STEP_SUMMARY
          echo "**Evaluate:** $INPUT_EVALUATE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency Versions" >> $GITHUB_STEP_SUMMARY
          echo "- **wizard:** $WIZARD_REF" >> $GITHUB_STEP_SUMMARY
          echo "- **context-mill:** $CONTEXT_MILL_REF" >> $GITHUB_STEP_SUMMARY
          echo "- **mcp (posthog):** $POSTHOG_REF" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$PR_URL" ]; then
            echo "**PR:** $PR_URL" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$YARA_REPORT" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### YARA Scanner" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$YARA_REPORT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if [ "$YARA_VIOLATIONS" = "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> ⚠️ YARA violations detected — see report above" >> $GITHUB_STEP_SUMMARY
            fi
          fi
        env:
          APP: ${{ matrix.app }}
          TRIGGER_ID: ${{ needs.discover.outputs.trigger_id }}
          INPUT_EVALUATE: ${{ needs.discover.outputs.input_evaluate }}
          WIZARD_REF: ${{ needs.discover.outputs.input_wizard_ref }}
          CONTEXT_MILL_REF: ${{ needs.discover.outputs.input_context_mill_ref }}
          POSTHOG_REF: ${{ needs.discover.outputs.input_posthog_ref }}
          PR_URL: ${{ steps.process-results.outputs.pr_url }}
          YARA_REPORT: ${{ steps.process-results.outputs.yara_report }}
          YARA_VIOLATIONS: ${{ steps.process-results.outputs.yara_violations }}

      - name: Get job ID
        if: always() && (needs.notify-start.outputs.thread_ts != '' || needs.discover.outputs.input_notify_pr == 'true')
        id: job-id
        run: |
          # Fetch the current job ID from the GitHub API
          JOB_ID=$(curl -s -H "Authorization: Bearer $APP_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPO/actions/runs/$GITHUB_RUN_ID/jobs" \
            | jq -r --arg app "$APP" '.jobs[] | select(.name | contains($app)) | .id' | head -1)
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
          echo "Job ID: $JOB_ID"
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP: ${{ matrix.app }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Notify Slack
        if: always() && needs.notify-start.outputs.thread_ts != ''
        run: |
          CONFIDENCE="$WIZARD_CONFIDENCE"
          if [ -z "$CONFIDENCE" ]; then
            CONFIDENCE="N/A"
          fi

          # Build job-specific logs URL
          JOB_URL="${SERVER_URL}/${GITHUB_REPO}/actions/runs/${RUN_ID}/job/${JOB_ID}"

          if [ -n "$PR_URL" ]; then
            PR_FIELD="<${PR_URL}|#${PR_NUMBER}> (<$JOB_URL|logs>)"
          else
            PR_FIELD="Failed (<$JOB_URL|logs>)"
          fi

          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"$SLACK_CHANNEL\",
              \"thread_ts\": \"$THREAD_TS\",
              \"text\": \"$APP\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*App:* $APP\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Confidence:* $CONFIDENCE\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*PR:* $PR_FIELD\"}
                  ]
                }
              ]
            }"
        env:
          WIZARD_CONFIDENCE: ${{ steps.process-results.outputs.confidence_score }}
          PR_URL: ${{ steps.process-results.outputs.pr_url }}
          PR_NUMBER: ${{ steps.process-results.outputs.pr_number }}
          JOB_ID: ${{ steps.job-id.outputs.job_id }}
          APP: ${{ matrix.app }}
          SERVER_URL: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}

      - name: Generate token for source repo
        if: always() && needs.discover.outputs.input_notify_pr == 'true' && needs.discover.outputs.input_source_pr_number != ''
        id: source-repo-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_PRIVATE_KEY }}
          owner: PostHog
          repositories: ${{ needs.discover.outputs.input_source_repo }}

      - name: Update source PR comment
        if: always() && needs.discover.outputs.input_notify_pr == 'true' && needs.discover.outputs.input_source_pr_number != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SOURCE_REPO: ${{ needs.discover.outputs.input_source_repo }}
          SOURCE_PR_NUMBER: ${{ needs.discover.outputs.input_source_pr_number }}
          TRIGGER_ID: ${{ needs.discover.outputs.trigger_id }}
          APP: ${{ matrix.app }}
          WIZARD_CONFIDENCE: ${{ steps.process-results.outputs.confidence_score }}
          WIZARD_PR_URL: ${{ steps.process-results.outputs.pr_url }}
          WIZARD_PR_NUMBER: ${{ steps.process-results.outputs.pr_number }}
          JOB_ID: ${{ steps.job-id.outputs.job_id }}
          SERVER_URL: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          YARA_REPORT: ${{ steps.process-results.outputs.yara_report }}
          YARA_VIOLATIONS: ${{ steps.process-results.outputs.yara_violations }}
        with:
          github-token: ${{ steps.source-repo-token.outputs.token }}
          script: |
            const owner = 'PostHog';
            const repo = process.env.SOURCE_REPO;
            const issueNumber = parseInt(process.env.SOURCE_PR_NUMBER, 10);
            const triggerId = process.env.TRIGGER_ID;
            const app = process.env.APP;
            const confidence = process.env.WIZARD_CONFIDENCE || 'N/A';
            const prUrl = process.env.WIZARD_PR_URL;
            const prNumber = process.env.WIZARD_PR_NUMBER;
            const jobUrl = `${process.env.SERVER_URL}/${process.env.GITHUB_REPO}/actions/runs/${process.env.RUN_ID}/job/${process.env.JOB_ID}`;
            const yaraReport = process.env.YARA_REPORT;
            const yaraViolations = process.env.YARA_VIOLATIONS === 'true';

            // Build this job's result row
            const yaraIcon = yaraViolations ? ' ⚠️' : (yaraReport ? ' ✓' : '');
            const prField = prUrl ? '[#' + prNumber + '](' + prUrl + ') ([logs](' + jobUrl + '))' : 'Failed ([logs](' + jobUrl + '))';
            const thisRow = '| `' + app + '` | ' + confidence + ' | ' + prField + ' |' + yaraIcon + ' |';

            // Marker to identify our comment (created by notify-pr-start job)
            const marker = '<!-- wizard-ci-results:' + triggerId + ' -->';

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: owner,
              repo: repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const existingComment = comments.data.find(function(c) { return c.body.includes(marker); });

            if (!existingComment) {
              console.log('Could not find results comment with marker: ' + marker);
              return;
            }

            // Update existing comment - replace this app's row
            var body = existingComment.body;
            const escapedApp = app.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const rowPattern = new RegExp('\\| `' + escapedApp + '` \\|[^\\n]*\\|', 'g');

            if (body.match(rowPattern)) {
              body = body.replace(rowPattern, thisRow);
            }

            // Append YARA report section if violations were detected
            if (yaraViolations && yaraReport) {
              const yaraMarker = '<!-- yara:' + app + ' -->';
              if (!body.includes(yaraMarker)) {
                body += '\n\n' + yaraMarker + '\n';
                body += '<details><summary>⚠️ YARA Scanner — ' + app + '</summary>\n\n';
                body += '```\n' + yaraReport + '\n```\n';
                body += '</details>';
              }
            }

            await github.rest.issues.updateComment({
              owner: owner,
              repo: repo,
              comment_id: existingComment.id,
              body: body
            });
            console.log('Updated comment for ' + app);

  # ============================================================================
  # SUMMARY: Final summary of all triggered workflows
  # ============================================================================
  summary:
    needs: [discover, notify-start, notify-pr-start, wizard-ci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Final Summary
        run: |
          echo "## Wizard CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger ID:** \`${{ needs.discover.outputs.trigger_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** ${{ needs.discover.outputs.input_source }}" >> $GITHUB_STEP_SUMMARY
          echo "**Total apps:** ${{ needs.discover.outputs.app_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Apps" >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.discover.outputs.apps }}' | jq -r '.[] | "- " + .' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger ID | \`${{ needs.discover.outputs.trigger_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | ${{ needs.discover.outputs.input_source }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Evaluate | ${{ needs.discover.outputs.input_evaluate }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base Branch | ${{ needs.discover.outputs.input_base_branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PostHog Region | ${{ needs.discover.outputs.input_posthog_region }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Wizard Ref | ${{ needs.discover.outputs.input_wizard_ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Context Mill Ref | ${{ needs.discover.outputs.input_context_mill_ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PostHog Ref | ${{ needs.discover.outputs.input_posthog_ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Search for trigger ID \`${{ needs.discover.outputs.trigger_id }}\` to find all related PRs." >> $GITHUB_STEP_SUMMARY

      - name: Update Slack message
        if: needs.notify-start.outputs.thread_ts != ''
        run: |
          curl -s -X POST https://slack.com/api/chat.update \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"${{ secrets.SLACK_CHANNEL_ID }}\",
              \"ts\": \"${{ needs.notify-start.outputs.thread_ts }}\",
              \"text\": \"Wizard CI Completed - Trigger ID: ${{ needs.discover.outputs.trigger_id }}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Trigger ID:* \`${{ needs.discover.outputs.trigger_id }}\`\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Apps:* ${{ needs.discover.outputs.app_count }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Source:* ${{ needs.discover.outputs.input_source }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}
                  ]
                },
                {
                  \"type\": \"context\",
                  \"elements\": [
                    {\"type\": \"mrkdwn\", \"text\": \"_AlaakuhhZAAM!_ :magic_wand: <${{ github.server_url }}/${{ github.repository }}/pulls?q=sort%3Aupdated-desc+is%3Apr+${{ needs.discover.outputs.trigger_id }}|See all created wizard runs>\"}
                  ]
                }
              ]
            }"

  # ============================================================================
  # SNAPSHOTS: real-TUI visual regression. Dispatch with snapshots=true to open a
  # side-by-side review PR for the app — independent of the evaluator, using the
  # same app token + setup + PostHog key (project hard-coded to 2, the bot key's).
  # ============================================================================
  snapshots:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_PRIVATE_KEY }}
          owner: PostHog
          repositories: wizard-workbench

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup wizard dependencies
        uses: ./.github/actions/setup-wizard-deps
        with:
          wizard_ref: ${{ inputs.wizard_ref || 'main' }}
          context_mill_ref: ${{ inputs.context_mill_ref || 'main' }}
          posthog_ref: ${{ inputs.posthog_ref || 'master' }}
          app_token: ${{ steps.app-token.outputs.token }}
          save_cache: 'false'

      - name: Render snapshots + open review PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_POSTHOG_PERSONAL_KEY }}
          POSTHOG_WIZARD_PROJECT_ID: '2'
          POSTHOG_REGION: ${{ inputs.posthog_region || 'us' }}
        run: |
          pnpm wizard-ci-snapshot-review "${{ inputs.app || 'basic-integration/javascript-node/express-todo' }}"

