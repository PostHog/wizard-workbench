name: Wizard Snapshots

# Visual-review dispatch: run the wizard e2e on an app, render the current TUI
# key-moment screens to screenshots, and open a PR for a human to eyeball —
# instead of running the agent evaluator.
#
# Triggered manually (workflow_dispatch) or programmatically (repository_dispatch
# wizard-snapshots-trigger). A `/wizard-ci` PR comment reaches this workflow as a
# repository_dispatch fired by the trusted comment handler — so this job runs its
# own code from a trusted ref and never checks out untrusted PR code. The
# client_payload carries comment_pr to post the report back on the PR.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App path (e.g. "basic-integration/javascript-node/express-todo")'
        required: false
        type: string
        default: 'basic-integration/javascript-node/express-todo'
      wizard_ref:
        description: 'Wizard repo branch/tag/sha'
        type: string
        default: 'main'
      context_mill_ref:
        description: 'Context Mill repo branch/tag/sha'
        type: string
        default: 'main'
      posthog_ref:
        description: 'PostHog repo branch/tag/sha (for MCP)'
        type: string
        default: 'master'
      project_id:
        description: 'PostHog project id the key is scoped to (defaults to the WIZARD_SNAPSHOTS_PROJECT_ID repo variable)'
        required: false
        type: string
      posthog_region:
        description: 'PostHog region'
        type: choice
        options: [us, eu]
        default: 'us'
  repository_dispatch:
    types: [wizard-snapshots-trigger]

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # commit the screenshots to the review branch
      pull-requests: write
      issues: write # comment on the triggering PR
      id-token: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_PRIVATE_KEY }}
          owner: PostHog
          repositories: wizard-workbench

      - name: Resolve request
        id: req
        # Bind event-controlled values to env vars and reference them as shell
        # variables — never interpolate ${{ github.event.* }} into the run script.
        env:
          IN_APP: ${{ inputs.app }}
          IN_WIZARD_REF: ${{ inputs.wizard_ref }}
          CP_APP: ${{ github.event.client_payload.app }}
          CP_WIZARD_REF: ${{ github.event.client_payload.wizard_ref }}
          CP_COMMENT_PR: ${{ github.event.client_payload.comment_pr }}
        run: |
          echo "app=${IN_APP:-${CP_APP:-basic-integration/javascript-node/express-todo}}" >> "$GITHUB_OUTPUT"
          echo "wizard_ref=${IN_WIZARD_REF:-${CP_WIZARD_REF:-main}}" >> "$GITHUB_OUTPUT"
          echo "comment_pr=${CP_COMMENT_PR}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup wizard dependencies
        # Exports WIZARD_PATH / CONTEXT_MILL_PATH / MCP_PATH.
        uses: ./.github/actions/setup-wizard-deps
        with:
          wizard_ref: ${{ steps.req.outputs.wizard_ref }}
          context_mill_ref: ${{ inputs.context_mill_ref || 'main' }}
          posthog_ref: ${{ inputs.posthog_ref || 'master' }}
          app_token: ${{ steps.app-token.outputs.token }}
          save_cache: 'false'

      - name: Render snapshots + report (review PR, and a comment when a comment_pr is set)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_POSTHOG_PERSONAL_KEY }}
          POSTHOG_WIZARD_PROJECT_ID: ${{ inputs.project_id || github.event.client_payload.project_id || vars.WIZARD_SNAPSHOTS_PROJECT_ID }}
          POSTHOG_REGION: ${{ inputs.posthog_region || 'us' }}
          APP: ${{ steps.req.outputs.app }}
          COMMENT_PR: ${{ steps.req.outputs.comment_pr }}
        run: |
          if [ -n "$COMMENT_PR" ]; then
            pnpm wizard-ci-snapshot-review "$APP" --comment-pr "$COMMENT_PR"
          else
            pnpm wizard-ci-snapshot-review "$APP"
          fi
