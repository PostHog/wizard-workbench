name: Wizard CI run

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Test app path (e.g., next-js/15-app-router-saas)'
        required: true
        type: string
      trigger_id:
        description: 'Trigger ID (inherited from trigger workflow, auto-generated if empty)'
        required: false
        type: string
        default: ''
      evaluate:
        description: 'Run PR evaluator'
        type: boolean
        default: true
      base_branch:
        description: 'Base branch for PR'
        type: string
        default: 'main'
      wizard_ref:
        description: 'Wizard repo branch/tag/sha'
        type: string
        default: 'main'
      examples_ref:
        description: 'Examples repo branch/tag/sha'
        type: string
        default: 'main'
      posthog_ref:
        description: 'PostHog repo branch/tag/sha (for MCP)'
        type: string
        default: 'master'
      posthog_region:
        description: 'PostHog region (us or eu)'
        required: false
        type: choice
        options:
          - us
          - eu
        default: 'us'
      slack_thread_ts:
        description: 'Slack thread timestamp for replies'
        required: false
        type: string
        default: ''

jobs:
  wizard-ci:
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.run-wizard.outputs.pr_url }}
      pr_number: ${{ steps.run-wizard.outputs.pr_number }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Clone and build Wizard CLI
        run: |
          echo "::group::Cloning wizard repo"
          git clone --depth 1 --branch ${{ inputs.wizard_ref }} \
            https://github.com/PostHog/wizard.git $HOME/wizard
          echo "::endgroup::"

          echo "::group::Installing wizard dependencies"
          cd $HOME/wizard
          pnpm install --frozen-lockfile
          echo "::endgroup::"

          echo "::group::Building wizard"
          pnpm build
          echo "::endgroup::"

          echo "WIZARD_PATH=$HOME/wizard" >> $GITHUB_ENV

      - name: Clone and build Examples
        run: |
          echo "::group::Cloning examples repo"
          git clone --depth 1 --branch ${{ inputs.examples_ref }} \
            https://github.com/PostHog/examples.git $HOME/examples
          echo "::endgroup::"

          echo "::group::Installing examples dependencies"
          cd $HOME/examples
          npm install
          echo "::endgroup::"

          echo "::group::Building examples MCP resources"
          npm run build:docs
          echo "::endgroup::"

          echo "EXAMPLES_PATH=$HOME/examples" >> $GITHUB_ENV

      - name: Clone PostHog monorepo and install MCP
        run: |
          echo "::group::Cloning PostHog monorepo (sparse checkout)"
          git clone --depth 1 --branch ${{ inputs.posthog_ref }} \
            --filter=blob:none --sparse \
            https://github.com/PostHog/posthog.git $HOME/posthog
          cd $HOME/posthog
          git sparse-checkout set services/mcp
          echo "::endgroup::"

          echo "::group::Installing MCP dependencies"
          cd $HOME/posthog/services/mcp/typescript
          # Use --ignore-workspace to avoid resolving all 45 workspace packages
          pnpm install --ignore-workspace --no-frozen-lockfile
          echo "::endgroup::"

          echo "MCP_PATH=$HOME/posthog/services/mcp" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config user.name "wizard-ci[bot]"
          git config user.email "wizard-ci[bot]@users.noreply.github.com"
          # Switch remote to HTTPS for token-based auth
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"

      - name: Debug - Test push permissions
        run: |
          # Test with a branch name format matching wizard-ci (with slashes)
          TEST_BRANCH="wizard-ci/test-$(date +%s)/test-app"
          git checkout -b "$TEST_BRANCH"

          # Create an actual file change (not just empty commit)
          echo "test" > /tmp/test-file.txt
          cp /tmp/test-file.txt test-push-file.txt
          git add test-push-file.txt
          git commit -m "Test push permissions with file change"

          echo "Testing push to $TEST_BRANCH..."
          if git push origin "$TEST_BRANCH"; then
            echo "Push succeeded! Cleaning up..."
            git push origin --delete "$TEST_BRANCH"
            git checkout main
            git branch -D "$TEST_BRANCH"
            rm -f test-push-file.txt
          else
            echo "Push failed!"
            git checkout main
            git branch -D "$TEST_BRANCH"
            rm -f test-push-file.txt
            exit 1
          fi

      - name: Run Wizard CI
        id: run-wizard
        run: |
          # Start MCP server in background
          cd $MCP_PATH/typescript
          pnpm dev &
          MCP_PID=$!

          # Wait for MCP server to be ready
          echo "Waiting for MCP server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8787/mcp > /dev/null 2>&1; then
              echo "MCP server is ready"
              break
            fi
            sleep 1
          done

          # Debug: check env vars are set
          echo "POSTHOG_PERSONAL_API_KEY set: $([ -n \"$POSTHOG_PERSONAL_API_KEY\" ] && echo 'yes' || echo 'no')"

          # Run wizard
          cd $GITHUB_WORKSPACE
          CMD="pnpm wizard-ci --app ${{ inputs.app }} --base ${{ inputs.base_branch }}"
          if [ -n "${{ inputs.trigger_id }}" ]; then
            CMD="$CMD --trigger-id ${{ inputs.trigger_id }}"
          fi
          if [ "${{ inputs.evaluate }}" = "true" ]; then
            CMD="$CMD --evaluate"
          fi
          $CMD 2>&1 | tee wizard-output.log
          WIZARD_EXIT=$?

          # Stop MCP server
          kill $MCP_PID 2>/dev/null || true

          # Extract PR URL
          PR_URL=$(grep -oP 'PR: \K(https://github.com/[^\s]+)' wizard-output.log || true)
          if [ -n "$PR_URL" ]; then
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            PR_NUM=$(echo $PR_URL | grep -oP '/pull/\K\d+')
            echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          fi

          # Extract confidence score from evaluator output (e.g., "### Confidence score: 4/5 👍")
          # Use grep + sed since grep -P (Perl regex) may not be available
          CONFIDENCE=$(grep -o 'Confidence score: [0-9]/[0-9]' wizard-output.log | head -1 | sed 's/Confidence score: //' || echo "")
          echo "confidence_score=$CONFIDENCE" >> $GITHUB_OUTPUT
          echo "Extracted confidence score: '$CONFIDENCE'"

          exit $WIZARD_EXIT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # PostHog credentials - used for both Wizard CI and PR evaluator (via LLM gateway)
          POSTHOG_REGION: ${{ inputs.posthog_region }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.GH_APP_POSTHOG_WIZARD_CI_BOT_POSTHOG_PERSONAL_KEY }}
          # Dependency paths
          WIZARD_PATH: ${{ env.WIZARD_PATH }}
          EXAMPLES_PATH: ${{ env.EXAMPLES_PATH }}
          MCP_PATH: ${{ env.MCP_PATH }}
          # Dependency refs (for PR body)
          WIZARD_REF: ${{ inputs.wizard_ref }}
          EXAMPLES_REF: ${{ inputs.examples_ref }}
          POSTHOG_REF: ${{ inputs.posthog_ref }}

      - name: Prepare artifact name
        if: always()
        id: artifact-name
        run: |
          # Replace slashes with dashes for valid artifact name
          SAFE_NAME="${{ inputs.app }}"
          SAFE_NAME="${SAFE_NAME//\//-}"
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Upload logs
        # Skip in act (local runner) - artifact upload requires GitHub infrastructure
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: wizard-ci-logs-${{ github.run_id }}-${{ steps.artifact-name.outputs.safe_name }}
          path: wizard-output.log

      - name: Label PR
        if: steps.run-wizard.outputs.pr_number
        run: |
          gh pr edit ${{ steps.run-wizard.outputs.pr_number }} --add-label "CI/CD"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Summary
        if: always()
        run: |
          echo "## Wizard CI Results: ${{ inputs.app }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** ${{ inputs.app }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.trigger_id }}" ]; then
            echo "**Trigger ID:** ${{ inputs.trigger_id }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Evaluate:** ${{ inputs.evaluate }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency Versions" >> $GITHUB_STEP_SUMMARY
          echo "- **wizard:** ${{ inputs.wizard_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **examples:** ${{ inputs.examples_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **mcp (posthog):** ${{ inputs.posthog_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.run-wizard.outputs.pr_url }}" ]; then
            echo "**PR:** ${{ steps.run-wizard.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Slack
        if: always() && inputs.slack_thread_ts != ''
        run: |
          CONFIDENCE="${{ steps.run-wizard.outputs.confidence_score }}"
          if [ -z "$CONFIDENCE" ]; then
            CONFIDENCE="N/A"
          fi

          if [ -n "${{ steps.run-wizard.outputs.pr_url }}" ]; then
            PR_FIELD="<${{ steps.run-wizard.outputs.pr_url }}|#${{ steps.run-wizard.outputs.pr_number }}>"
          else
            PR_FIELD="❌ (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|logs>)"
          fi

          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"${{ secrets.SLACK_CHANNEL_ID }}\",
              \"thread_ts\": \"${{ inputs.slack_thread_ts }}\",
              \"text\": \"${{ inputs.app }}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*App:* ${{ inputs.app }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Confidence:* $CONFIDENCE\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*PR:* $PR_FIELD\"}
                  ]
                }
              ]
            }"
