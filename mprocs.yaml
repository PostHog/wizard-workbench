procs:
  # ═══════════════════════════════════════════════════════════════════════════
  # DEV SERVERS - Auto-start for hot-reload development
  # ═══════════════════════════════════════════════════════════════════════════

  examples:
    # Resources manifest ZIP available at: http://localhost:8765/examples-mcp-resources.zip
    shell: "cd ${EXAMPLES_PATH:-repos/examples} && npm run dev"
    autostart: true
    stop_signal: SIGTERM
    env_file: .env

  mcp:
    # Use dev:local-resources to read from local examples server 
    # Runs at http://localhost:8787
    shell: "cd ${MCP_PATH:-repos/posthog/products/mcp} && pnpm run dev:local-resources"
    autostart: true
    stop_signal: SIGTERM
    env_file: .env

  mcp-inspector:
    # Opens MCP Inspector UI at http://localhost:6274
    shell: "cd ${MCP_PATH:-repos/posthog/products/mcp} && pnpm run inspector"
    autostart: true
    env_file: .env

  wizard:
    # Skip global link - just build and watch. Use wizard-run to execute.
    shell: "cd ${WIZARD_PATH:-repos/wizard} && pnpm build && pnpm build:watch"
    autostart: true
    stop_signal: SIGTERM
    env_file: .env

  # ═══════════════════════════════════════════════════════════════════════════
  # WIZARD RUNS - Execute wizard on test apps (press 's' to start)
  # ═══════════════════════════════════════════════════════════════════════════

  wizard-run:
    # Interactive app selector - choose which app to run wizard on
    shell: "npx tsx services/wizard-run/index.ts"
    autostart: false
    env_file: .env

  # ═══════════════════════════════════════════════════════════════════════════
  # EVALUATION
  # ═══════════════════════════════════════════════════════════════════════════

  workbench-evaluate:
    shell: "pnpm run evaluate --test-run"
    autostart: false
    env_file: .env

