<div class="login">
  <div class="login-box">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="input-field">
        <input id="username" type="text" formControlName="username" placeholder=" " aria-label="Username" autocomplete="username" />
        <label for="username">Username</label>
      </div>
      <div class="input-field">
        <input id="password" type="password" formControlName="password" placeholder=" " aria-label="Password" autocomplete="current-password" />
        <label for="password">Password</label>
      </div>
      <button type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>
  </div>
</div>
