; Production pool settings. Loaded after the image's docker.conf, so these win.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Do not leak the container environment into workers. Laravel reads its
; settings from the cached config; list anything the workers read directly.
clear_env = yes
env[APP_ENV] = $APP_ENV
env[APP_DEBUG] = $APP_DEBUG
