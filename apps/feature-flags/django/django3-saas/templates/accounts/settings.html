{% extends 'base.html' %}

{% block title %}Settings{% endblock %}

{% block content %}
<h1>Settings</h1>

<div class="card">
    <h2>Profile Information</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>

<div class="card mt-1">
    <h2>Security</h2>
    <p>
        <a href="{% url 'accounts:password_reset' %}">Change Password</a>
    </p>
</div>
{% endblock %}
