{% extends 'base.html' %}

{% block title %}Edit Project{% endblock %}

{% block content %}
<h1>Edit Project</h1>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'dashboard:projects' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
