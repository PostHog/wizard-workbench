{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Login</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
</form>

<p class="mt-1">
    <a href="{% url 'accounts:password_reset' %}">Forgot your password?</a>
</p>
<p>Don't have an account? <a href="{% url 'accounts:register' %}">Register</a></p>
{% endblock %}
