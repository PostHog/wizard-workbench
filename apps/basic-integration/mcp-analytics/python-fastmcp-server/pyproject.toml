[project]
name = "notes-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp",
    "opentelemetry-sdk",
    "posthog==7.84.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
notes-server = "notes_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
