<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Bookmark vault{% endblock %}</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --border: #e3e2dd;
        --text: #1b1b18;
        --muted: #6f6c63;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.5rem; }
      h1 { margin: 0 0 0.25rem; font-size: 2rem; }
      p.lede { margin: 0 0 2rem; color: var(--muted); }
      a { color: var(--accent); }
      nav a { font-size: 0.875rem; }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1rem 1.25rem;
        margin-bottom: 0.75rem;
      }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      input {
        padding: 0.6rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      input.grow { flex: 1; }
      button {
        padding: 0.55rem 0.9rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      button.ghost { color: var(--muted); }
      .meta { color: var(--muted); font-size: 0.85rem; }
      .tag {
        font-size: 0.75rem;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.1rem 0.5rem;
        margin-right: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
